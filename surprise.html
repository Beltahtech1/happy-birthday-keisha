<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Surprise!</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      text-align: center;
      overflow-x: hidden;
    }

    /* Glitter background */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1px);
      background-size: 3px 3px;
      animation: sparkle 6s linear infinite;
      z-index: -1;
    }
    @keyframes sparkle {
      from { background-position: 0 0; }
      to { background-position: 100% 100%; }
    }

    h1 { color: #ff4081; margin-top: 30px; font-size: 3em; }

    .surprise-box {
      display: inline-block;
      margin: 20px;
      padding: 20px;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 20px #ff4081, 0 0 40px #ff80ab;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .surprise-box:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #fff, 0 0 60px #ff4081;
    }

    /* Back button */
    .back-btn {
      display: inline-block;
      margin: 30px auto;
      padding: 14px 28px;
      border-radius: 35px;
      background: linear-gradient(45deg, #ff4081, #ff80ab, #ffc1e3);
      color: white;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 0 15px #ff4081, 0 0 30px #ff80ab, 0 0 45px #ffc1e3;
      transition: all 0.4s ease;
    }
    .back-btn:hover {
      box-shadow: 0 0 25px #fff, 0 0 50px #ff4081, 0 0 70px #ff80ab;
      transform: scale(1.08);
    }

    /* Balloons and ribbons */
    .balloon {
      position: absolute;
      bottom: -100px;
      width: 80px;
      animation: float 12s infinite ease-in;
    }
    @keyframes float {
      0% { transform: translateY(0); }
      100% { transform: translateY(-120vh); }
    }
    .ribbon {
      position: absolute;
      top: 0;
      width: 60px;
      animation: sway 6s infinite ease-in-out;
    }
    @keyframes sway {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
      100% { transform: rotate(0deg); }
    }

    /* Glitter pop effect */
    .glitter {
      position: fixed;
      width: 10px;
      height: 10px;
      background: #ff4081;
      animation: pop 2s linear forwards;
    }
    @keyframes pop {
      to { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }

    /* Fireworks finale */
    .firework {
      position: fixed;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      animation: explode 1.5s ease-out forwards;
    }
    @keyframes explode {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(20); opacity: 0; }
    }
  </style>
</head>
<body>
  <h1>🎉 Surprise, Keisha!</h1>
  <p>Click a box to reveal a sparkling surprise!</p>

  <div class="surprise-box" onclick="showSurprise(0,'🎂 Happy Birthday, Keisha! 💖')">Surprise 1</div>
  <div class="surprise-box" onclick="showSurprise(1,'🌈 You are our rainbow, Keisha!')">Surprise 2</div>
  <div class="surprise-box" onclick="showSurprise(2,'🎁 Beltah & Staicy love you forever!')">Surprise 3</div>
  <div class="surprise-box" onclick="showSurprise(3,'✨ May your life always sparkle!')">Surprise 4</div>

  <!-- Grand Finale (hidden until all clicked) -->
  <div id="finale" class="hidden card">
    <h2>🎆 Grand Finale 🎆</h2>
    <p>Keisha, you are the brightest star in our lives. Happy Birthday from Dad Beltah and Mom Staicy!</p>
    <iframe id="finaleMusic" width="0" height="0" src="" frameborder="0" allow="autoplay"></iframe>
  </div>

  <!-- Back button -->
  <a href="index.html" class="back-btn">⬅ Back to Menu</a>

  <!-- Balloons -->
  <img src="balloon.png" class="balloon" style="left:10%;" />
  <img src="balloon.png" class="balloon" style="left:40%;" />
  <img src="balloon.png" class="balloon" style="left:70%;" />

  <!-- Ribbons -->
  <img src="ribbon.png" class="ribbon" style="left:20%;" />
  <img src="ribbon.png" class="ribbon" style="left:60%;" />

  <script>
    let clicked = [false, false, false, false];

    function showSurprise(index, message) {
      alert(message);
      clicked[index] = true;
      launchGlitter();

      if (clicked.every(val => val)) {
        document.getElementById("finale").classList.remove("hidden");
        launchFireworks();
        playFinaleMusic();
      }
    }

    function launchGlitter() {
      for (let i = 0; i < 50; i++) {
        const glitter = document.createElement("div");
        glitter.className = "glitter";
        glitter.style.left = Math.random() * window.innerWidth + "px";
        glitter.style.top = Math.random() * window.innerHeight + "px";
        glitter.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
        document.body.appendChild(glitter);
        setTimeout(() => glitter.remove(), 2000);
      }
    }

    function launchFireworks() {
      for (let i = 0; i < 20; i++) {
        const fw = document.createElement("div");
        fw.className = "firework";
        fw.style.left = Math.random() * window.innerWidth + "px";
        fw.style.top = Math.random() * window.innerHeight + "px";
        fw.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
        document.body.appendChild(fw);
        setTimeout(() => fw.remove(), 1500);
      }
    }

    function playFinaleMusic() {
      // Replace YOUR_VIDEO_ID with the actual YouTube video ID
      const musicFrame = document.getElementById("finaleMusic");
      musicFrame.src = "https://www.youtube.com/embed/020g-0hhCAU?autoplay=1&loop=1&playlist=020g-0hhCAU";
    }
  </script>
</body>
</html>
