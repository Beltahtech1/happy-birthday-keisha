<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise!</title>
  <style>
    :root {
      --bg: #07070c;
      --card-bg: rgba(15, 15, 25, 0.65);
      --border: rgba(255, 64, 129, 0.3);
      --accent: #ff4081;
      --accent-glow: rgba(255, 64, 129, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #a1a1aa;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 1400px; height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(255, 64, 129, 0.2), transparent 60%);
      z-index: -2;
      pointer-events: none;
    }

    #ambientCanvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 800px;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 10px 0;
      background: linear-gradient(to right, #fff, #ff80ab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
      width: 100%;
      max-width: 500px;
      margin-bottom: 30px;
    }

    @media (max-width: 480px) {
      .grid-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }

    .surprise-box {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 35px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #fff;
    }

    .surprise-box::before, .surprise-box::after {
      content: "";
      position: absolute;
      background: linear-gradient(to right, #ff4081, #ff80ab);
      box-shadow: 0 0 8px rgba(255, 64, 129, 0.5);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2;
    }
    .surprise-box::before {
      top: 0; bottom: 0; left: calc(50% - 4px); width: 8px;
    }
    .surprise-box::after {
      left: 0; right: 0; top: calc(50% - 4px); height: 8px;
    }

    .surprise-box .gift-icon {
      font-size: 2.5rem;
      transition: transform 0.3s ease;
      z-index: 1;
    }

    .surprise-box span:last-child {
      z-index: 1;
    }

    .surprise-box:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 15px 35px rgba(255, 64, 129, 0.3), 0 0 15px var(--accent-glow);
    }

    .surprise-box:hover .gift-icon {
      transform: rotate(15deg) scale(1.1);
    }

    .surprise-box.opened {
      border-color: #00e676;
      background: rgba(0, 230, 118, 0.05);
      box-shadow: 0 5px 15px rgba(0, 230, 118, 0.1);
      cursor: default;
      transform: none !important;
    }

    .surprise-box.opened::before { transform: translateY(-100%); opacity: 0; }
    .surprise-box.opened::after { transform: translateX(100%); opacity: 0; }

    .surprise-box.opened .gift-icon {
      transform: scale(0.9);
      opacity: 0.5;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 7, 12, 0.85);
      backdrop-filter: blur(15px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: #12121d;
      border: 2px solid var(--accent);
      border-radius: 32px;
      padding: 40px 30px;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 25px 60px rgba(255, 64, 129, 0.4);
      transform: scale(0.85);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }
    .modal-overlay.active .modal-content {
      transform: scale(1);
    }

    .modal-content h3 {
      font-size: 1.5rem;
      margin: 0 0 15px 0;
      color: #fff;
    }

    .modal-content p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: var(--text-main);
      margin: 0 0 25px 0;
      min-height: 72px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 32px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .close-btn {
      background: linear-gradient(45deg, #ff4081, #ff80ab);
      color: #fff;
      box-shadow: 0 5px 15px rgba(255, 64, 129, 0.3);
    }
    .close-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 64, 129, 0.5);
    }

    .finale-card {
      background: linear-gradient(135deg, rgba(255, 64, 129, 0.15), rgba(15, 15, 25, 0.8));
      border: 2px solid var(--accent);
      border-radius: 32px;
      padding: 45px 35px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      backdrop-filter: blur(25px);
      box-shadow: 0 0 40px rgba(255, 64, 129, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05);
      margin-top: 15px;
      animation: finaleEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes finaleEntrance {
      from { opacity: 0; transform: translateY(30px) scale(0.95); filter: blur(10px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .finale-card h2 {
      margin: 0 0 15px 0;
      font-size: 1.8rem;
      background: linear-gradient(to right, #fff, #ffd54f, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulsingGlow 2s ease-in-out infinite;
    }

    @keyframes pulsingGlow {
      0%, 100% { filter: drop-shadow(0 0 2px var(--accent)); }
      50% { filter: drop-shadow(0 0 12px var(--accent)); }
    }

    .finale-card p {
      font-size: 1.1rem;
      line-height: 1.65;
      color: #f3f4f6;
      margin: 0;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: #fff;
      margin-top: 30px;
    }
    .back-btn:hover {
      border-color: var(--accent);
      background: rgba(255, 64, 129, 0.08);
      box-shadow: 0 0 25px var(--accent-glow);
      transform: translateY(-2px);
    }

    .hidden { display: none !important; }

    .particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      z-index: 200;
    }

    footer {
      width: 100%;
      padding: 24px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      letter-spacing: 0.05em;
      text-align: center;
    }
  </style>
</head>
<body>

  <canvas id="ambientCanvas"></canvas>

  <main>
    <h1>🎉 Surprise, Keisha!</h1>
    <p class="subtitle">Click a box to reveal a sparkling surprise!</p>

    <div class="grid-container" id="giftsGrid">
      <div class="surprise-box" onclick="revealSurprise(0, '🌸 To My Beautiful Queen Staicy', 'Thank you for being the most incredible mother. Watching you protect, carry, and care for our baby girl throughout college and beyond showed me how pure your heart is. I love you endlessly.')">
        <span class="gift-icon">🎁</span>
        <span>Box One</span>
      </div>
      <div class="surprise-box" onclick="revealSurprise(1, '👼 To Our Angel Keisha', 'You are the most precious gift heaven sent to us. Your small laughs and sweet milestones completely changed our world. Daddy and Mommy promise to love and guide you forever.')">
        <span class="gift-icon">💝</span>
        <span>Box Two</span>
      </div>
      <div class="surprise-box" onclick="revealSurprise(2, '✨ Boundless Family Love', 'From our sweet beginning in college to building our dreams in Nairobi and Juja, our little bond has grown into a strong, beautiful family. Together, we can conquer anything.')">
        <span class="gift-icon">⭐</span>
        <span>Box Three</span>
      </div>
      <div class="surprise-box" onclick="revealSurprise(3, '👑 Our Shining Promise', 'No matter where paths lead or how big you grow, Daddy will always work hard to make your paths smooth. May your wonderful life always sparkle and radiate pure happiness!')">
        <span class="gift-icon">👑</span>
        <span>Box Four</span>
      </div>
    </div>

    <div id="finale" class="hidden finale-card">
      <h2>🎆 Grand Finale 🎆</h2>
      <p>Keisha, you are the brightest star in our lives. Happy Birthday from Dad Beltah and Mom Staicy!</p>
      <iframe id="finaleMusic" width="0" height="0" src="" frameborder="0" allow="autoplay" class="hidden"></iframe>
    </div>

    <a href="index.html" class="action-btn back-btn">⬅ Back to Menu</a>
  </main>

  <div class="modal-overlay" id="surpriseModal">
    <div class="modal-content">
      <h3 id="modalTitle">Surprise</h3>
      <p id="modalMessage"></p>
      <button class="action-btn close-btn" onclick="closeModal()">Awesome ✨</button>
    </div>
  </div>

  <footer>
    CODED SUCCESSFULLY BY BELTAH
  </footer>

  <script>
    let clicked = [false, false, false, false];
    let typingInterval = null;

    function playAudioTone(freq, wave, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = wave;
        osc.frequency.value = freq;
        
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) { console.log("Audio activation requires layout interaction."); }
    }

    document.querySelectorAll('.surprise-box').forEach(box => {
      box.addEventListener('mouseenter', () => {
        playAudioTone(380, 'sine', 0.08);
      });
    });

    function revealSurprise(index, title, message) {
      if (clicked[index]) return;
      
      clicked[index] = true;
      playAudioTone(587.33, 'triangle', 0.25);
      
      const boxes = document.querySelectorAll('.surprise-box');
      boxes[index].classList.add('opened');
      
      const rect = boxes[index].getBoundingClientRect();
      const originX = rect.left + rect.width / 2;
      const originY = rect.top + rect.height / 2;
      spawnBurst(originX, originY, 40);

      setTimeout(() => {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('surpriseModal').classList.add('active');
        triggerTypewriterEffect(message);
      }, 400);

      if (clicked.every(val => val)) {
        setTimeout(() => {
          document.getElementById("giftsGrid").classList.add("hidden");
          document.getElementById("finale").classList.remove("hidden");
          triggerContinuousFinaleExplosions();
          playFinaleMusic();
        }, 1200);
      }
    }

    function triggerTypewriterEffect(text) {
      const container = document.getElementById('modalMessage');
      container.innerText = ""; 
      clearInterval(typingInterval);
      
      let index = 0;
      typingInterval = setInterval(() => {
        if (index < text.length) {
          container.innerText += text.charAt(index);
          if(index % 2 === 0) playAudioTone(850, 'sine', 0.01);
          index++;
        } else {
          clearInterval(typingInterval);
        }
      }, 35);
    }

    function closeModal() {
      document.getElementById('surpriseModal').classList.remove('active');
      clearInterval(typingInterval);
      playAudioTone(220, 'sine', 0.1);
    }

    function playFinaleMusic() {
      const musicFrame = document.getElementById("finaleMusic");
      musicFrame.src = "https://www.youtube.com/embed/020g-0hhCAU?autoplay=1&loop=1&playlist=020g-0hhCAU";
      setTimeout(() => playAudioTone(523.25, 'sine', 0.5), 100);
      setTimeout(() => playAudioTone(659.25, 'sine', 0.5), 250);
      setTimeout(() => playAudioTone(783.99, 'sine', 0.7), 400);
    }

    function spawnBurst(x, y, count) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'particle';
        
        const size = Math.random() * 8 + 4;
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 65%)`;
        
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        
        document.body.appendChild(el);

        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 8 + 4;
        let vx = Math.cos(angle) * velocity;
        let vy = Math.sin(angle) * velocity;
        let posX = x;
        let posY = y;
        let opacity = 1;

        function updateParticle() {
          if (opacity <= 0.02) {
            el.remove();
            return;
          }
          vy += 0.18;
          posX += vx;
          posY += vy;
          opacity -= 0.02;
          
          el.style.left = `${posX}px`;
          el.style.top = `${posY}px`;
          el.style.opacity = opacity;
          
          requestAnimationFrame(updateParticle);
        }
        requestAnimationFrame(updateParticle);
      }
    }

    function triggerContinuousFinaleExplosions() {
      let runCount = 0;
      const interval = setInterval(() => {
        if (runCount > 15) {
          clearInterval(interval);
          return;
        }
        const rx = Math.random() * window.innerWidth;
        const ry = Math.random() * (window.innerHeight * 0.7);
        spawnBurst(rx, ry, 35);
        playAudioTone(150 + Math.random() * 100, 'triangle', 0.3);
        runCount++;
      }, 400);
    }

    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class FloatingItem {
      constructor() {
        this.reset();
        this.y = Math.random() * canvas.height; 
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 100;
        this.size = Math.random() * 12 + 6;
        this.speed = Math.random() * 0.8 + 0.4;
        this.type = Math.random() < 0.35 ? 'emoji' : 'glitter';
        this.emoji = ['✨', '🎈', '🎉', '💖', '🎀'][Math.floor(Math.random() * 5)];
        this.color = `hsl(${Math.random() * 40 + 320}, 100%, 75%)`;
        this.alpha = Math.random() * 0.3 + 0.1;
        this.angle = Math.random() * Math.PI * 2;
        this.wobbleSpeed = Math.random() * 0.02 + 0.005;
      }
      update() {
        this.y -= this.speed;
        this.angle += this.wobbleSpeed;
        this.x += Math.sin(this.angle) * 0.4;
        if (this.y < -50) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        if (this.type === 'emoji') {
          ctx.font = `${this.size}px Arial`;
          ctx.fillText(this.emoji, this.x, this.y);
        } else {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size / 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < 30; i++) {
      particles.push(new FloatingItem());
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
    }
    animate();
  </script>
</body>
</html>
