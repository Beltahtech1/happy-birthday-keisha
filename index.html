<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown to Surprise</title>
  <style>
    :root {
      --bg: #07070c;
      --card-bg: rgba(15, 15, 25, 0.65);
      --border: rgba(255, 64, 129, 0.3);
      --accent: #ff4081;
      --accent-glow: rgba(255, 64, 129, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #a1a1aa;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 1400px; height: 100%;
      background: radial-gradient(circle at 50% 30%, rgba(255, 64, 129, 0.2), transparent 60%);
      z-index: -2;
      pointer-events: none;
    }

    #ambientCanvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 800px;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 10px 0;
      background: linear-gradient(to right, #fff, #ff80ab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .countdown-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 32px;
      padding: 40px 25px;
      width: 100%;
      max-width: 500px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      margin-bottom: 25px;
      box-sizing: border-box;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .time-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 15px 5px;
    }

    .time-num {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    .time-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 5px;
    }

    .date-marker {
      font-size: 1.1rem;
      color: #ffd54f;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 15px;
    }

    .input-group {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .input-label {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .date-input {
      background: rgba(15, 15, 25, 0.8);
      border: 2px solid var(--border);
      color: #fff;
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      width: 100%;
      max-width: 220px;
      box-sizing: border-box;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .date-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 40px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      width: 100%;
      max-width: 260px;
    }

    .unlock-btn {
      background: linear-gradient(45deg, #ff4081, #ff80ab);
      color: #fff;
      box-shadow: 0 5px 20px rgba(255, 64, 129, 0.3);
    }
    .unlock-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 25px rgba(255, 64, 129, 0.5), 0 0 15px var(--accent-glow);
    }

    .status-msg {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #ef4444;
      font-weight: 500;
      min-height: 22px;
    }
    .status-msg.ready {
      color: #22c55e;
    }

    footer {
      width: 100%;
      padding: 24px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      letter-spacing: 0.05em;
      text-align: center;
    }
  </style>
</head>
<body>

  <canvas id="ambientCanvas"></canvas>

  <main>
    <h1>⏳ A Special Moment Awaits</h1>
    <p class="subtitle">Counting down to a very beautiful memory...</p>

    <div class="countdown-card">
      <div class="date-marker">Unlock Target: 05/06/2025</div>
      
      <div class="timer-grid">
        <div class="time-box"><div id="days" class="time-num">00</div><div class="time-label">Days</div></div>
        <div class="time-box"><div id="hours" class="time-num">00</div><div class="time-label">Hrs</div></div>
        <div class="time-box"><div id="minutes" class="time-num">00</div><div class="time-label">Mins</div></div>
        <div class="time-box"><div id="seconds" class="time-num">00</div><div class="time-label">Secs</div></div>
      </div>

      <div class="input-group">
        <label for="birthdayInput" class="input-label">Enter Keisha's Birthday to Instant Unlock:</label>
        <input 
          type="text" 
          id="birthdayInput" 
          class="date-input" 
          placeholder="07/04/2013" 
          maxlength="10"
          oninput="formatDateInput(this)"
        >
      </div>

      <button id="actionButton" class="action-btn unlock-btn" onclick="checkUnlockCondition()">
        Unlock Surprise ✨
      </button>
      
      <div id="statusText" class="status-msg">🔒 Enter the correct date matching DD/MM/YYYY to proceed.</div>
    </div>
  </main>

  <footer>
    CODED SUCCESSFULLY BY BELTAH
  </footer>

  <script>
    // Configured matching key criteria: 05/06/2025 (DD/MM/YYYY)
    const targetDate = new Date("2025-06-05T00:00:00").getTime();
    const correctBirthday = "05/06/2025"; 

    function playAudioTone(freq, wave, dur) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.type = wave;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function formatDateInput(input) {
      let val = input.value.replace(/\D/g, '');
      if (val.length > 2 && val.length <= 4) {
        val = val.slice(0, 2) + '/' + val.slice(2);
      } else if (val.length > 4) {
        val = val.slice(0, 2) + '/' + val.slice(2, 4) + '/' + val.slice(4, 8);
      }
      input.value = val;
    }

    function checkUnlockCondition() {
      const inputVal = document.getElementById("birthdayInput").value.trim();
      const status = document.getElementById("statusText");
      const now = new Date().getTime();

      if (inputVal === correctBirthday || now >= targetDate) {
        playAudioTone(523.25, 'sine', 0.15);
        status.innerText = "🔓 Access Granted! Redirecting...";
        status.className = "status-msg ready";
        setTimeout(() => {
          playAudioTone(659.25, 'sine', 0.3);
          window.location.href = "surprise.html";
        }, 600);
      } else {
        playAudioTone(180, 'sawtooth', 0.2);
        status.innerText = "❌ Incorrect date code. Please try again!";
        status.className = "status-msg";
      }
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
        
        const status = document.getElementById("statusText");
        status.innerText = "🔓 The surprise timeline has arrived! Click Unlock to view.";
        status.className = "status-msg ready";
        return;
      }

      const d = Math.floor(difference / (1000 * 60 * 60 * 24));
      const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = d < 10 ? "0" + d : d;
      document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
      document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
      document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class FloatingItem {
      constructor() {
        this.reset();
        this.y = Math.random() * canvas.height; 
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = canvas.height + Math.random() * 100;
        this.size = Math.random() * 10 + 5;
        this.speed = Math.random() * 0.6 + 0.3;
        this.type = Math.random() < 0.25 ? 'emoji' : 'glitter';
        this.emoji = ['✨', '🎈', '🎉', '💖'][Math.floor(Math.random() * 4)];
        this.color = `hsl(${Math.random() * 40 + 320}, 100%, 75%)`;
        this.alpha = Math.random() * 0.25 + 0.1;
        this.angle = Math.random() * Math.PI * 2;
        this.wobbleSpeed = Math.random() * 0.02 + 0.005;
      }
      update() {
        this.y -= this.speed;
        this.angle += this.wobbleSpeed;
        this.x += Math.sin(this.angle) * 0.3;
        if (this.y < -50) this.reset();
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        if (this.type === 'emoji') {
          ctx.font = `${this.size}px Arial`;
          ctx.fillText(this.emoji, this.x, this.y);
        } else {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size / 4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    for (let i = 0; i < 25; i++) {
      particles.push(new FloatingItem());
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
    }
    animate();
  </script>
</body>
</html>
