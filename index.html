<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keisha's Birthday Hub</title>
  <style>
    :root {
      --bg: #07070c;
      --card-bg: rgba(15, 15, 25, 0.65);
      --border: rgba(255, 64, 129, 0.3);
      --accent: #ff4081;
      --accent-glow: rgba(255, 64, 129, 0.4);
      --text-main: #f3f4f6;
      --text-muted: #d1d1d6;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Mesh Glow Behind Content */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 1400px; height: 100%;
      background: radial-gradient(circle at 50% 25%, rgba(255, 64, 129, 0.2), transparent 60%);
      z-index: -2;
      pointer-events: none;
    }

    /* Full-Screen FX Space Layer */
    #fxCanvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 999;
      pointer-events: none;
    }

    /* Background Ambient Moving Particles */
    .ambient-layer {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none;
    }
    .ambient-item {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0.25;
    }
    .ambient-up {
      bottom: -50px;
      animation: riseUp 14s infinite linear;
    }
    .ambient-down {
      top: -50px;
      animation: fallDown 14s infinite linear;
    }
    @keyframes riseUp {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.35; }
      90% { opacity: 0.35; }
      100% { transform: translateY(-115vh) translateX(40px) rotate(360deg); opacity: 0; }
    }
    @keyframes fallDown {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.35; }
      90% { opacity: 0.35; }
      100% { transform: translateY(115vh) translateX(-40px) rotate(-360deg); opacity: 0; }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    /* Premium Circular Avatar Display Component */
    .avatar-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 24px auto;
      position: relative;
    }
    .avatar-ring {
      position: absolute;
      top: -6px; left: -6px; right: -6px; bottom: -6px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--accent), #ff80ab, #ffc1e3);
      animation: spinAvatar 8s linear infinite;
      z-index: 1;
    }
    @keyframes spinAvatar {
      100% { transform: rotate(360deg); }
    }
    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: #14141f;
      position: relative;
      z-index: 2;
      overflow: hidden;
      border: 2px solid var(--bg);
    }
    .avatar-inner img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 32px;
      padding: 40px 30px;
      width: 100%;
      max-width: 540px;
      backdrop-filter: blur(25px);
      box-shadow: 0 0 30px rgba(255, 64, 129, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.05);
      box-sizing: border-box;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 10px 0;
      background: linear-gradient(to right, #fff, #ff80ab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Highly Visible Custom Neon Calendar Component Layout */
    .calendar-select {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 35px 0;
    }
    .select-wrapper {
      position: relative;
      background: rgba(20, 20, 35, 0.9);
      border: 2px solid #ff4081;
      border-radius: 16px;
      box-shadow: 0 0 12px rgba(255, 64, 129, 0.3);
      transition: all 0.3s ease;
    }
    .select-wrapper:hover {
      border-color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    }
    select {
      width: 100%;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 16px 10px;
      font-size: 1.05rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      text-align: center;
    }
    select option {
      background-color: #141423;
      color: #ffffff;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      background: rgba(15, 15, 25, 0.85);
      border: 2px solid var(--border);
      border-radius: 16px;
      color: #fff;
      padding: 16px;
      box-sizing: border-box;
      resize: none;
      height: 90px;
      margin: 15px 0 5px 0;
      font-size: 0.95rem;
    }

    /* Dynamic Fluid Interactive Buttons Component Layout */
    button, nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 36px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-action {
      background: linear-gradient(45deg, #ff4081, #ff80ab);
      color: #ffffff;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 5px 20px rgba(255, 64, 129, 0.4);
    }
    .btn-action:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(255, 64, 129, 0.7), 0 0 15px #fff;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 35px;
      width: 100%;
    }
    nav a {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: #fff;
    }
    nav a:hover {
      border-color: var(--accent);
      background: rgba(255, 64, 129, 0.08);
      box-shadow: 0 0 25px var(--accent-glow);
      transform: translateY(-3px);
    }

    /* Flip-Clock Digital Layout Panel Component */
    .countdown-grid {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 35px 0;
    }
    .time-block {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      min-width: 75px;
    }
    .time-num {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
      display: block;
    }
    .time-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .hidden { display: none !important; }

    footer {
      width: 100%;
      padding: 24px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- FX Animation Space Layer Canvas -->
  <canvas id="fxCanvas"></canvas>

  <!-- Ambient Floating Layer: Rising and Falling Glitters and Ribbons -->
  <div class="ambient-layer">
    <div class="ambient-item ambient-up" style="left: 5%; animation-delay: 0s;">✨</div>
    <div class="ambient-item ambient-up" style="left: 25%; animation-delay: 4s;">🎉</div>
    <div class="ambient-item ambient-up" style="left: 45%; animation-delay: 1s;">✨</div>
    <div class="ambient-item ambient-up" style="left: 65%; animation-delay: 6s;">🎀</div>
    <div class="ambient-item ambient-up" style="left: 85%; animation-delay: 3s;">✨</div>
    
    <div class="ambient-item ambient-down" style="left: 15%; animation-delay: 2s;">✨</div>
    <div class="ambient-item ambient-down" style="left: 35%; animation-delay: 7s;">🎀</div>
    <div class="ambient-item ambient-down" style="left: 55%; animation-delay: 0s;">✨</div>
    <div class="ambient-item ambient-down" style="left: 75%; animation-delay: 5s;">🎉</div>
    <div class="ambient-item ambient-down" style="left: 95%; animation-delay: 3s;">✨</div>
  </div>

  <main>
    <!-- Dynamic Circular Avatar Component -->
    <div class="avatar-container">
      <div class="avatar-ring"></div>
      <div class="avatar-inner">
        <img src="https://files.catbox.moe/mpmubr.jpeg" alt="Keisha">
      </div>
    </div>

    <!-- Target Date Validation Selector Panel -->
    <div id="verification" class="card">
      <h1>🎂 Keisha's Birthday</h1>
      <p style="color: var(--text-muted); margin: 0;">Unlock her automated milestone celebration:</p>
      
      <div class="calendar-select">
        <div class="select-wrapper">
          <select id="year" onchange="populateDays()">
            <script>
              for (let y = 2026; y >= 2010; y--) {
                document.write(`<option value="${y}">${y}</option>`);
              }
            </script>
          </select>
        </div>
        <div class="select-wrapper">
          <select id="month" onchange="populateDays()">
            <option value="01">Jan</option><option value="02">Feb</option>
            <option value="03">Mar</option><option value="04">Apr</option>
            <option value="05">May</option><option value="06">Jun</option>
            <option value="07">Jul</option><option value="08">Aug</option>
            <option value="09">Sep</option><option value="10">Oct</option>
            <option value="11">Nov</option><option value="12">Dec</option>
          </select>
        </div>
        <div class="select-wrapper">
          <select id="day">
          </select>
        </div>
      </div>

      <button class="btn-action" onclick="checkBirthday()">Unlock Timeline</button>

      <div id="wishSection" class="hidden" style="margin-top: 25px;">
        <p style="color: var(--accent); margin: 0 0 10px 0; font-size: 0.95rem;">Incorrect target date! Leave a 100-character wish to proceed:</p>
        <textarea id="wishInput" maxlength="100" placeholder="Write exactly 100 characters..."></textarea>
        <p id="charCount" style="font-size: 0.8rem; color: var(--text-muted); text-align: right; margin: 0 0 15px 0;">0 / 100</p>
        <button class="btn-action" onclick="checkWish()">Submit Alternative Access</button>
      </div>
    </div>

    <!-- Main Dynamic Application Dashboard -->
    <div id="mainContent" class="hidden card">
      <h1 id="celebrationHeader">🎉 Loading Milestone...</h1>
      <p id="targetStatus" style="color: var(--text-muted); margin: 0; font-size: 0.95rem;"></p>
      
      <div class="countdown-grid">
        <div class="time-block"><span id="box-d" class="time-num">00</span><span class="time-label">Days</span></div>
        <div class="time-block"><span id="box-h" class="time-num">00</span><span class="time-label">Hrs</span></div>
        <div class="time-block"><span id="box-m" class="time-num">00</span><span class="time-label">Mins</span></div>
        <div class="time-block"><span id="box-s" class="time-num">00</span><span class="time-label">Secs</span></div>
      </div>

      <nav>
        <a href="gallery.html">📸 Gallery Hub</a>
        <a href="story.html">🌈 Our Story</a>
        <a href="letter.html">💌 Letters</a>
        <a href="surprise.html">🎁 Surprise</a>
      </nav>
    </div>
  </main>

  <iframe id="bgMusic" width="0" height="0" src="" frameborder="0" allow="autoplay" style="display:none;"></iframe>

  <footer>
    CODED SUCCESSFULLY BY BELTAH[cite: 2]
  </footer>

  <script>
    function populateDays() {
      const yearSelect = document.getElementById("year");
      const monthSelect = document.getElementById("month");
      const daySelect = document.getElementById("day");
      
      const selectedYear = parseInt(yearSelect.value);
      const selectedMonth = parseInt(monthSelect.value);
      
      let startDay = 1;
      let endDay = new Date(selectedYear, selectedMonth, 0).getDate();
      
      if (selectedYear === 2010 && selectedMonth === 1) {
        startDay = 6;
      }
      if (selectedYear === 2026 && selectedMonth === 12) {
        endDay = 27;
      }
      
      const currentSelectedDay = daySelect.value;
      daySelect.innerHTML = "";
      
      for (let d = startDay; d <= endDay; d++) {
        const val = String(d).padStart(2, '0');
        const option = document.createElement("option");
        option.value = val;
        option.text = d;
        if (val === currentSelectedDay) {
          option.selected = true;
        }
        daySelect.appendChild(option);
      }
    }

    // Persist session state across page redirects using SessionStorage
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById("year").value = "2010";
      document.getElementById("month").value = "08";
      populateDays();
      document.getElementById("day").value = "21";

      if (sessionStorage.getItem("keishaUnlocked") === "true") {
        document.getElementById("verification").classList.add("hidden");
        document.getElementById("mainContent").classList.remove("hidden");
        document.getElementById("mainContent").style.opacity = "1";
        document.getElementById("mainContent").style.transform = "scale(1)";
        runInfiniteEngine();
        playMusic();
      }
    });

    document.getElementById("wishInput").addEventListener("input", function() {
      document.getElementById("charCount").innerText = `${this.value.length} / 100`;
    });

    function checkBirthday() {
      const input = `${document.getElementById("year").value}-${document.getElementById("month").value}-${document.getElementById("day").value}`;
      if (input === "2025-06-05") {
        triggerCelebrationUnlock();
      } else {
        document.getElementById("wishSection").classList.remove("hidden");
      }
    }

    function checkWish() {
      if (document.getElementById("wishInput").value.length === 100) {
        triggerCelebrationUnlock();
      } else {
        alert("Your authorization message must be exactly 100 characters long!");
      }
    }

    // FX Engine
    const canvas = document.getElementById('fxCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let runFX = false;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class CelebrationParticle {
      constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type;
        this.radius = type === 'firework' ? Math.random() * 3 + 1 : Math.random() * 4 + 2;
        this.angle = Math.random() * Math.PI * 2;
        this.speed = type === 'firework' ? Math.random() * 6 + 2 : Math.random() * 3 + 1;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed + (type === 'ribbon' ? 1 : 0);
        this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
        this.alpha = 1;
        this.decay = Math.random() * 0.015 + 0.01;
        this.rotation = Math.random() * 360;
        this.rotSpeed = Math.random() * 4 - 2;
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.type === 'firework') this.vy += 0.04; 
        this.alpha -= this.decay; this.rotation += this.rotSpeed;
      }
      draw() {
        ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color;
        if (this.type === 'firework') {
          ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.translate(this.x, this.y); ctx.rotate(this.rotation * Math.PI / 180);
          ctx.fillRect(-this.radius, -this.radius / 3, this.radius * 2, this.radius / 1.5);
        }
        ctx.restore();
      }
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 60; i++) particles.push(new CelebrationParticle(x, y, 'firework'));
      for (let i = 0; i < 30; i++) particles.push(new CelebrationParticle(x, y, 'ribbon'));
    }

    function animateFX() {
      if (!runFX && particles.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height); return;
      }
      requestAnimationFrame(animateFX);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (runFX && Math.random() < 0.08) {
        createExplosion(Math.random() * canvas.width, Math.random() * (canvas.height * 0.6));
      }
      particles = particles.filter(p => p.alpha > 0);
      particles.forEach(p => { p.update(); p.draw(); });
    }

    function triggerCelebrationUnlock() {
      sessionStorage.setItem("keishaUnlocked", "true");
      runFX = true;
      animateFX();
      playMusic();

      document.getElementById("verification").style.opacity = "0";
      document.getElementById("verification").style.transform = "scale(0.9)";
      
      setTimeout(() => {
        document.getElementById("verification").classList.add("hidden");
        document.getElementById("mainContent").classList.remove("hidden");
        document.getElementById("mainContent").style.opacity = "0";
        document.getElementById("mainContent").style.transform = "scale(0.95)";
        
        setTimeout(() => {
          document.getElementById("mainContent").style.opacity = "1";
          document.getElementById("mainContent").style.transform = "scale(1)";
          runInfiniteEngine();
        }, 50);
      }, 400);

      setTimeout(() => { runFX = false; }, 6000);
    }

    function getOrdinalSuffix(number) {
      const j = number % 10, k = number % 100;
      if (j == 1 && k != 11) return number + "st";
      if (j == 2 && k != 12) return number + "nd";
      if (j == 3 && k != 13) return number + "rd";
      return number + "th";
    }

    function runInfiniteEngine() {
      const birthYear = 2025;
      
      setInterval(() => {
        const now = new Date();
        const currentYear = now.getFullYear();
        let targetBirthday = new Date(`June 5, ${currentYear} 00:00:00`);
        
        if (now.getTime() > targetBirthday.getTime()) {
          targetBirthday = new Date(`June 5, ${currentYear + 1} 00:00:00`);
        }

        const distance = targetBirthday.getTime() - now.getTime();
        const ageTarget = targetBirthday.getFullYear() - birthYear;
        
        document.getElementById("celebrationHeader").innerText = `🎉 Keisha’s ${getOrdinalSuffix(ageTarget)} Birthday`;
        document.getElementById("targetStatus").innerText = `Time remaining until she reaches this beautiful milestone:`;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("box-d").innerText = String(days).padStart(2, '0');
        document.getElementById("box-h").innerText = String(hours).padStart(2, '0');
        document.getElementById("box-m").innerText = String(minutes).padStart(2, '0');
        document.getElementById("box-s").innerText = String(seconds).padStart(2, '0');
      }, 1000);
    }

    function playMusic() {
      document.getElementById("bgMusic").src = "https://www.youtube.com/embed/ho08YLYDM88?autoplay=1&mute=1&loop=1&playlist=ho08YLYDM88&controls=0";
    }
  </script>
</body>
</html>
